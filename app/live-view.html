<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播小窗 · Avatar Printer</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#hint{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#667282;font:14px 'Microsoft YaHei',sans-serif;letter-spacing:1px;text-align:center;line-height:1.9}
#hint a{color:#9fc3e8}
#plate{position:fixed;left:50%;bottom:3.5%;transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:12px;background:#f4f0e9;color:#1b2028;border-radius:10px;padding:10px 18px;box-shadow:0 8px 25px #0008;font-family:'Microsoft YaHei',sans-serif;z-index:5}
#plate img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e9a48d}
#plate strong{font-size:24px;display:block}
#plate span{display:block;font-size:11px;color:#656b73}
#rank-hud{position:fixed;display:none;flex-direction:column;background:linear-gradient(#0d2531,#091b25);border-radius:8px;box-shadow:0 8px 22px #0009;font-family:'Microsoft YaHei','PingFang SC',sans-serif;overflow:hidden;z-index:6}
#rank-hud .rh-title{color:#eddb9a;font-weight:800;text-align:center;border-bottom:1px solid rgba(237,219,154,.3)}
#rank-hud .rh-row{display:flex;align-items:center}
#rank-hud .rh-ava{border-radius:50%;overflow:hidden;flex:0 0 auto;background:#213440;border-style:solid}
#rank-hud .rh-ava img{width:100%;height:100%;object-fit:cover;display:block}
#rank-hud .rh-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
#rank-hud .rh-lab{font-weight:700}
#rank-hud .rh-name{font-weight:700;color:#e9f6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rank-hud .rh-score{color:#9fb3c8;white-space:nowrap}
</style></head><body>
<div id="hint"><div>⏳ 等待主窗口直播画面…</div><div style="font-size:12px">请保持主窗口（打印台）开启且不要最小化<br><a id="fallback" href="/index.html?scene=1" style="display:none">镜像不可用？点此用独立渲染窗口打开</a></div></div>
<video id="v" autoplay playsinline muted></video>
<div id="plate"><img id="plate-img" alt="当前头像"><div><span id="plate-name">等待头像进入队列</span><strong id="plate-score">-- <small>分</small></strong></div></div>
<div id="rank-hud"></div>
<div id="interaction" tabindex="0" aria-label="左键旋转，右键平移，滚轮缩放" style="position:fixed;touch-action:none;outline:none"></div>
<script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script>
<script type="module">
import * as THREE from './assets/three.module.js';
import {OrbitControls} from './assets/OrbitControls.js';
// 直播小窗：只做一件事——把主窗口正在渲染的 3D 画面镜像过来给 OBS 抓取。
// 不渲染、不打印、不参与主窗口的打印选举；信号走本机服务，使用独立浏览器配置与进程。
import {SceneChannel} from './scene-channel.mjs';
const bc = new SceneChannel();
let inputChannel=null,pendingIce=[];
function sendControl(m){if(inputChannel?.readyState==='open')inputChannel.send(JSON.stringify(m));else bc.postMessage(m)}
const v = document.getElementById('v'), hint = document.getElementById('hint');
v.addEventListener('playing',()=>{try{bc.postMessage({type:'view-ready'})}catch(e){}});
let pc = null, watchdog = 0, connected = false;
const interaction=document.getElementById('interaction');
const camera=new THREE.PerspectiveCamera(36,16/9,.1,500);
const controls=new OrbitControls(camera,interaction);
controls.enabled=false;controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.05;controls.minDistance=3;controls.maxDistance=180;
controls.listenToKeyEvents(interaction);
let syncing=false,interacting=false;
controls.addEventListener('start',()=>interacting=true);
controls.addEventListener('end',()=>interacting=false);
controls.addEventListener('change',()=>{if(!syncing)sendControl({type:'view-camera-change',p:camera.position.toArray(),t:controls.target.toArray()})});
interaction.addEventListener('pointerdown',()=>interaction.focus());
function layout(){const aspect=(v.videoWidth||1280)/(v.videoHeight||720);const w=Math.min(innerWidth,innerHeight*aspect),h=w/aspect;Object.assign(interaction.style,{width:w+'px',height:h+'px',left:(innerWidth-w)/2+'px',top:(innerHeight-h)/2+'px'});camera.aspect=aspect;camera.updateProjectionMatrix()}
window.addEventListener('resize',layout);v.addEventListener('resize',layout);layout();
function tick(){requestAnimationFrame(tick);if(controls.enabled)controls.update()}tick();

function showHint(on) { hint.style.display = on ? 'flex' : 'none' }
function armWatchdog() { clearTimeout(watchdog); watchdog = setTimeout(() => { if (!v.srcObject || v.readyState < 2) { connected = false; showHint(true); request() } }, 5000) }
function request() { try { bc.postMessage({ type: 'view-request' }) } catch (e) { } }
function teardown() { inputChannel=null; if (pc) { try { pc.close() } catch (e) { } pc = null } v.srcObject = null; connected = false }

// 本机部署修正：状态牌除了走数据通道推送，还每 1.5 秒从本地服务读一次状态。
// 数据通道偶发中断时，小窗会停在最后一次收到的那一帧（隐藏后再也显示不出来），这里兜底。
function applyPlate(m){
  const p=document.getElementById('plate');
  if(p)p.style.display=m.on?'flex':'none';
  const pn=document.getElementById('plate-name'),ps=document.getElementById('plate-score'),pi=document.getElementById('plate-img');
  if(pn&&m.name)pn.textContent=m.name;
  if(ps&&m.score!==undefined&&m.score!=='')ps.innerHTML=m.score;
  if(pi&&m.avatar){pi.src=m.avatar;pi.style.display='';}else if(pi&&!m.avatar){pi.style.display='none'}
  applyRankHud(m)
}
// 采集用「屏幕角标」：排行榜不再依赖 3D 贴图，直接按窗口像素画 2D 文字，
// 直播压到 540p 时名字和贡献值仍然是按最大可用字号渲染的。
const RH_RING=['#ffcf6b','#dfe3e8','#e0925b'],RH_LABEL=['冠军','亚军','季军'];
let rankData=[];
function hudRect(){const aspect=(v.videoWidth||1080)/(v.videoHeight||1920);const w=Math.min(innerWidth,innerHeight*aspect);const h=w/aspect;return {w:h>0?w:0,h,left:(innerWidth-w)/2,top:(innerHeight-h)/2}}
function sizeRankHud(){
  const hud=document.getElementById('rank-hud');if(!hud||hud.style.display==='none')return;
  const r=hudRect();if(!(r.w>40))return;
  const hudW=Math.round(r.w*0.40),pad=Math.round(r.w*0.014),ava=Math.round(r.w*0.070);
  const tF=Math.round(r.w*0.038),lF=Math.round(r.w*0.029),nF=Math.round(r.w*0.032),sF=Math.round(r.w*0.027);
  hud.style.width=hudW+'px';
  hud.style.left=Math.round(r.left+r.w*0.565)+'px';
  hud.style.top=Math.round(r.top+r.h*0.205)+'px';
  const t=hud.querySelector('.rh-title');
  if(t){t.style.fontSize=tF+'px';t.style.padding=Math.round(pad*0.7)+'px 0 '+Math.round(pad*0.6)+'px';t.style.marginBottom=Math.round(pad*0.5)+'px'}
  hud.querySelectorAll('.rh-row').forEach(row=>{
    row.style.gap=Math.round(pad*0.8)+'px';
    row.style.padding=Math.round(pad*0.45)+'px '+Math.round(pad*0.7)+'px';
    const a=row.querySelector('.rh-ava');if(a){a.style.width=ava+'px';a.style.height=ava+'px';a.style.borderWidth=Math.max(2,Math.round(ava*0.09))+'px'}
    const l=row.querySelector('.rh-lab');if(l)l.style.fontSize=lF+'px';
    const n=row.querySelector('.rh-name');if(n)n.style.fontSize=nF+'px';
    const s=row.querySelector('.rh-score');if(s)s.style.fontSize=sF+'px';
  })
}
function renderRankHud(){
  const hud=document.getElementById('rank-hud');if(!hud)return;
  hud.innerHTML='';
  const t=document.createElement('div');t.className='rh-title';t.textContent='贡献排行 TOP3';hud.appendChild(t);
  const rows=rankData.slice(0,3);
  for(let i=0;i<3;i++){
    const it=rows[i]||null;
    const row=document.createElement('div');row.className='rh-row';
    const box=document.createElement('div');box.className='rh-ava';box.style.borderStyle='solid';box.style.borderColor=RH_RING[i];
    if(it&&it.a){const img=document.createElement('img');img.src=it.a;img.alt='';box.appendChild(img)}
    const txt=document.createElement('div');txt.className='rh-txt';
    const lab=document.createElement('div');lab.className='rh-lab';lab.style.color=RH_RING[i];lab.textContent=RH_LABEL[i];
    const nm=document.createElement('div');nm.className='rh-name';nm.textContent=it?(it.n||''):'虚位以待';if(!it)nm.style.color='#5b7183';
    const sc=document.createElement('div');sc.className='rh-score';sc.textContent=it?('贡献值 '+(it.s||0)):'—';
    txt.append(lab,nm,sc);row.append(box,txt);hud.appendChild(row)
  }
  hud.style.display='flex';sizeRankHud()
}
function applyRankHud(m){
  const hud=document.getElementById('rank-hud');if(!hud)return;
  if(!(m&&m.hud)){hud.style.display='none';rankData=[];window.__rhSig='';return}
  const sig=JSON.stringify(m.rank||[]);
  if(sig!==window.__rhSig){window.__rhSig=sig;rankData=(Array.isArray(m.rank)?m.rank:[]);renderRankHud()}
  hud.style.display='flex';sizeRankHud()
}
window.addEventListener('resize',()=>sizeRankHud());
v.addEventListener('loadedmetadata',()=>sizeRankHud());
function reportDiag(extra){try{fetch('/__diag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({kind:'view'},extra))}).catch(()=>{})}catch(e){}}
const pullPlate=()=>fetch('/__plate',{cache:'no-store'}).then(r=>{if(!r.ok){reportDiag({err:'http',status:r.status})}return r.json()}).then(m=>{applyPlate(m);window.__lastPull=Date.now()}).catch(e=>reportDiag({err:'fetch',m:String(e)}));
setInterval(pullPlate,1500);pullPlate();
setInterval(()=>reportDiag({age:window.__lastPull?Date.now()-window.__lastPull:null,plate:document.getElementById('plate')?document.getElementById('plate').style.display:'?'}),10000);
bc.onmessage = async ev => {
  const m = ev.data || {};
  if(m.type==='view-plate'){applyPlate(m)}
  else if(m.type==='view-size'&&Number.isFinite(m.width)&&Number.isFinite(m.height)){window.pywebview?.api?.resize_scene(m.width,m.height).catch(()=>{});}
  else if(m.type==='view-camera'&&!interacting){syncing=true;const damping=controls.enableDamping;controls.enableDamping=false;controls.update();camera.position.fromArray(m.p);controls.target.fromArray(m.t);camera.fov=m.fov;camera.updateProjectionMatrix();controls.update();controls.enableDamping=damping;controls.enabled=true;syncing=false;}
  else if (m.type === 'view-offer' && m.sdp) {
    bc.postMessage({type:'view-camera-request'});
    try {
      teardown();
      pc = new RTCPeerConnection();
      pc.ondatachannel=e=>{inputChannel=e.channel};
      pc.ontrack = e => {
        v.srcObject = e.streams[0];
        v.play().catch(() => { });
        connected = true; showHint(false); armWatchdog();
      };
      pc.onicecandidate = e => { if (e.candidate) try { bc.postMessage({ type: 'view-ice', candidate: { candidate: e.candidate.candidate, sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex } }) } catch (e) { } };
      pc.onconnectionstatechange = () => { if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) reset() };
      await pc.setRemoteDescription(m.sdp);
      for(const c of pendingIce.splice(0))await pc.addIceCandidate(c);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      try { bc.postMessage({ type: 'view-answer', sdp: { type: ans.type, sdp: ans.sdp } }) } catch (e) { }
    } catch (e) { reset() }
  } else if (m.type === 'view-ice' && pc && m.candidate) {
    try { pc.remoteDescription?pc.addIceCandidate(m.candidate).catch(() => { }):pendingIce.push(m.candidate) } catch (e) { }
  }
};
function reset() { teardown(); showHint(true); request(); armWatchdog() }

let previousFrames=0,previousStatsAt=performance.now();
setInterval(()=>{if(!connected)return;const now=performance.now(),quality=v.getVideoPlaybackQuality(),frames=quality.totalVideoFrames-quality.droppedVideoFrames;const fps=Math.max(0,Math.round((frames-previousFrames)*1000/(now-previousStatsAt)));previousFrames=frames;previousStatsAt=now;bc.postMessage({type:'view-stats',fps,width:v.videoWidth,height:v.videoHeight})},2000);
request();
setInterval(() => { try { bc.postMessage(connected ? { type: 'view-ping' } : { type: 'view-request' }) } catch (e) { } }, 3000);
armWatchdog();
window.addEventListener('beforeunload', () => { try { bc.postMessage({ type: 'view-bye' }) } catch (e) { } });
</script>
</body></html>
